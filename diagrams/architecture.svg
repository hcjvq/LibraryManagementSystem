<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640">
  <style>
    .box { fill:#f3f4f6; stroke:#374151; stroke-width:1.5; rx:8; }
    .title { font: bold 15px sans-serif; fill:#111827 }
    .small { font: 12px sans-serif; fill:#333844 }
    .arrow { stroke:#1f2937; stroke-width:2; fill:none; marker-end:url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937" />
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="30" y="30" class="title">LibraryManagementSystem — 模块架构图</text>

  <!-- 第一行顶层模块：入口、控制器、业务层 -->
  <rect x="30" y="70" width="200" height="75" class="box"/>
  <text x="50" y="98" class="title">main.c</text>
  <text x="50" y="118" class="small">启动入口 / 主循环</text>

  <rect x="280" y="50" width="180" height="115" class="box"/>
  <text x="300" y="78" class="title">Controller 层</text>
  <text x="300" y="98" class="small">controller/*.c/.h</text>

  <rect x="510" y="50" width="180" height="115" class="box"/>
  <text x="530" y="78" class="title">Service 层</text>
  <text x="530" y="98" class="small">service/*.c/.h</text>

  <!-- 中间核心数据层 Mapper -->
  <rect x="280" y="210" width="410" height="140" class="box"/>
  <text x="300" y="240" class="title">Mapper 层（数据持久）</text>
  <text x="300" y="262" class="small">mapper/*.c/.h — 全局数组 &amp; 文件 IO 读写</text>

  <!-- 底层公共模块 & 全局数据 -->
  <rect x="30" y="230" width="200" height="90" class="box"/>
  <text x="50" y="262" class="title">Common 公共工具</text>
  <text x="50" y="284" class="small">common/common.h, common.c</text>

  <rect x="740" y="220" width="160" height="110" class="box"/>
  <text x="760" y="252" class="title">Globals 全局数组</text>
  <text x="760" y="274" class="small">g_users[], g_book_arr[]</text>

  <!-- 连线箭头 -->
  <!-- main → Controller -->
  <path d="M230 107 L280 107" class="arrow"/>
  <!-- Controller → Service -->
  <path d="M460 107 L510 107" class="arrow"/>
  <!-- Service 垂直下到 Mapper -->
  <path d="M600 165 L600 210" class="arrow"/>
  <!-- Controller 垂直下到 Mapper -->
  <path d="M370 165 L370 210" class="arrow"/>
  <!-- Common 右连 Mapper -->
  <path d="M230 275 L280 275" class="arrow"/>
  <!-- Mapper 右连 Globals -->
  <path d="M690 275 L740 275" class="arrow"/>

  <!-- 箭头标注文字（全部错开，不遮挡线条/方框） -->
  <text x="235" y="95" class="small">init/run()</text>
  <text x="365" y="95" class="small">调用业务</text>
  <text x="612" y="190" class="small">数据CRUD</text>
  <text x="322" y="190" class="small">访问Mapper</text>
  <text x="235" y="292" class="small">宏/结构体</text>
  <text x="692" y="292" class="small">读写内存数组</text>

  <!-- 底部说明 -->
  <text x="30" y="610" class="small">架构说明：main入口 → Controller控制层 → Service业务层 → Mapper持久层；Common提供公共类型，Globals存储全局数据</text>
</svg>