<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <style>
    .lifeline { stroke:#374151; stroke-width:2; }
    .box { fill:#f8fafc; stroke:#111827; stroke-width:1; rx:6; }
    .title { font: bold 13px sans-serif; fill:#0f172a }
    .small { font: 12px sans-serif; fill:#0f172a }
    .arrow { stroke:#0f172a; stroke-width:1.5; marker-end:url(#arrow);} 
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a" />
    </marker>
  </defs>

  <text x="20" y="24" class="title">借书流程（序列）</text>

  <!-- Lifelines -->
  <rect x="40" y="50" width="140" height="32" class="box"/><text x="50" y="72" class="small">User (UI)</text>
  <rect x="220" y="50" width="160" height="32" class="box"/><text x="230" y="72" class="small">Controller</text>
  <rect x="430" y="50" width="160" height="32" class="box"/><text x="440" y="72" class="small">Service</text>
  <rect x="640" y="50" width="160" height="32" class="box"/><text x="650" y="72" class="small">Mapper</text>

  <!-- Messages -->
  <path d="M180 86 L220 86" class="arrow"/><text x="182" y="80" class="small">选择借书(book_id)</text>
  <path d="M380 100 L430 100" class="arrow"/><text x="390" y="94" class="small">borrow_book_service(user_name, book_id)</text>
  <path d="M590 120 L640 120" class="arrow"/><text x="600" y="114" class="small">get_user_id(user_name)</text>
  <path d="M640 140 L590 140" class="arrow"/><text x="600" y="134" class="small">user_id</text>
  <path d="M590 160 L640 160" class="arrow"/><text x="600" y="154" class="small">is_book_available(book_id)</text>
  <path d="M640 180 L590 180" class="arrow"/><text x="600" y="174" class="small">available?</text>
  <path d="M590 200 L640 200" class="arrow"/><text x="600" y="194" class="small">borrow_book(user_id, book_id)</text>
  <path d="M640 220 L590 220" class="arrow"/><text x="600" y="214" class="small">Success/Fail</text>
  <path d="M430 240 L380 240" class="arrow"/><text x="410" y="234" class="small">返回结果给 Controller</text>
  <path d="M220 260 L180 260" class="arrow"/><text x="200" y="254" class="small">显示借书结果</text>

  <!-- Lifelines vertical lines -->
  <line x1="110" y1="90" x2="110" y2="480" class="lifeline" stroke-dasharray="4 4"/>
  <line x1="300" y1="90" x2="300" y2="480" class="lifeline" stroke-dasharray="4 4"/>
  <line x1="510" y1="90" x2="510" y2="480" class="lifeline" stroke-dasharray="4 4"/>
  <line x1="720" y1="90" x2="720" y2="480" class="lifeline" stroke-dasharray="4 4"/>

</svg>